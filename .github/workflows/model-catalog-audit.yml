name: Weekly AI Chip intelligence discovery

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Lookback window for recent releases
        type: number
        required: false
        default: 45

permissions:
  contents: read

concurrency:
  group: ai-chip-intelligence-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore change-detection state
        uses: actions/cache@v4
        with:
          path: .cache/ai-chip-intelligence-state.json
          key: ai-chip-intelligence-state-${{ github.run_id }}
          restore-keys: |
            ai-chip-intelligence-state-
      - name: Restore persistent review aging state
        uses: actions/cache@v4
        with:
          path: .cache/ai-chip-review-state.json
          key: ai-chip-review-state-${{ github.run_id }}
          restore-keys: |
            ai-chip-review-state-
      - name: Stage both caches for transactional checkpointing
        run: |
          if [ -f .cache/ai-chip-intelligence-state.json ]; then
            cp .cache/ai-chip-intelligence-state.json "$RUNNER_TEMP/intelligence-state-staged.json"
          fi
          if [ -f .cache/ai-chip-review-state.json ]; then
            cp .cache/ai-chip-review-state.json "$RUNNER_TEMP/review-state-staged.json"
          fi
      - name: Record restored-cache presence
        run: |
          printf 'DISCOVERY_CACHE_PRESENT=%s\n' "$(test -f .cache/ai-chip-intelligence-state.json && echo true || echo false)" >> "$GITHUB_ENV"
          printf 'REVIEW_CACHE_PRESENT=%s\n' "$(test -f .cache/ai-chip-review-state.json && echo true || echo false)" >> "$GITHUB_ENV"
      - name: Validate curated source registry
        run: python3 scripts/validate_intelligence_sources.py
      - name: Discover releases, model changes and publisher candidates
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 45 }}
        run: |
          python3 scripts/run_intelligence_discovery.py \
            --days "$LOOKBACK_DAYS" \
            --state-file "$RUNNER_TEMP/intelligence-state-staged.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-discovery.json" \
            --summary-path "$RUNNER_TEMP/ai-chip-intelligence-summary.md"
      - name: Audit source coverage and possible discovery gaps
        run: |
          python3 scripts/audit_intelligence_source_coverage.py \
            --registry "data/intelligence-sources.json" \
            --discovery "$RUNNER_TEMP/ai-chip-intelligence-discovery.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-source-coverage.json" \
            --markdown "$RUNNER_TEMP/ai-chip-intelligence-source-coverage.md"
      - name: Extract structured claim candidates
        run: |
          python3 scripts/extract_intelligence_claims.py \
            --input "$RUNNER_TEMP/ai-chip-intelligence-discovery.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-claims.json" \
            --summary-path "$RUNNER_TEMP/ai-chip-intelligence-claims.md"
      - name: Build conservative cross-source evidence graph
        run: |
          python3 scripts/build_intelligence_evidence_graph.py \
            --input "$RUNNER_TEMP/ai-chip-intelligence-claims.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-evidence-graph.json" \
            --summary-path "$RUNNER_TEMP/ai-chip-intelligence-evidence-review.md"
      - name: Prioritize unverified evidence review queue
        run: |
          python3 scripts/triage_intelligence_claims.py \
            --discovery "$RUNNER_TEMP/ai-chip-intelligence-discovery.json" \
            --claims "$RUNNER_TEMP/ai-chip-intelligence-claims.json" \
            --graph "$RUNNER_TEMP/ai-chip-intelligence-evidence-graph.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-triage.json" \
            --markdown "$RUNNER_TEMP/ai-chip-intelligence-triage.md"
      - name: Track first-seen claims and review aging
        run: |
          python3 scripts/track_intelligence_review_state.py \
            --triage "$RUNNER_TEMP/ai-chip-intelligence-triage.json" \
            --claims "$RUNNER_TEMP/ai-chip-intelligence-claims.json" \
            --state "$RUNNER_TEMP/review-state-staged.json" \
            --ledger "data/intelligence-review-decisions.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-review-state.json" \
            --markdown "$RUNNER_TEMP/ai-chip-intelligence-review-aging.md"
      - name: Audit end-to-end stage consistency and source health
        run: |
          python3 scripts/audit_intelligence_run.py \
            --discovery "$RUNNER_TEMP/ai-chip-intelligence-discovery.json" \
            --claims "$RUNNER_TEMP/ai-chip-intelligence-claims.json" \
            --graph "$RUNNER_TEMP/ai-chip-intelligence-evidence-graph.json" \
            --triage "$RUNNER_TEMP/ai-chip-intelligence-triage.json" \
            --review-state "$RUNNER_TEMP/ai-chip-intelligence-review-state.json" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-health.json" \
            --markdown "$RUNNER_TEMP/ai-chip-intelligence-health.md"
      - name: Produce operational observability snapshot
        run: |
          python3 scripts/build_intelligence_operational_snapshot.py \
            --discovery "$RUNNER_TEMP/ai-chip-intelligence-discovery.json" \
            --health "$RUNNER_TEMP/ai-chip-intelligence-health.json" \
            --review-state "$RUNNER_TEMP/ai-chip-intelligence-review-state.json" \
            --discovery-cache-present "$DISCOVERY_CACHE_PRESENT" \
            --review-cache-present "$REVIEW_CACHE_PRESENT" \
            --output "$RUNNER_TEMP/ai-chip-intelligence-operations.json"
      - name: Commit cached checkpoints after successful audit
        run: |
          test -s "$RUNNER_TEMP/intelligence-state-staged.json"
          test -s "$RUNNER_TEMP/review-state-staged.json"
          mkdir -p .cache
          cp "$RUNNER_TEMP/intelligence-state-staged.json" .cache/ai-chip-intelligence-state.json
          cp "$RUNNER_TEMP/review-state-staged.json" .cache/ai-chip-review-state.json
      - name: Publish review summaries
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-summary.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-source-coverage.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-source-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-claims.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-claims.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-triage.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-triage.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-review-aging.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-review-aging.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-health.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-health.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ai-chip-intelligence-evidence-review.md" ]; then
            cat "$RUNNER_TEMP/ai-chip-intelligence-evidence-review.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chip-intelligence-discovery
          path: |
            ${{ runner.temp }}/ai-chip-intelligence-discovery.json
            ${{ runner.temp }}/ai-chip-intelligence-summary.md
            ${{ runner.temp }}/ai-chip-intelligence-source-coverage.json
            ${{ runner.temp }}/ai-chip-intelligence-source-coverage.md
            ${{ runner.temp }}/ai-chip-intelligence-claims.json
            ${{ runner.temp }}/ai-chip-intelligence-claims.md
            ${{ runner.temp }}/ai-chip-intelligence-evidence-graph.json
            ${{ runner.temp }}/ai-chip-intelligence-evidence-review.md
            ${{ runner.temp }}/ai-chip-intelligence-triage.json
            ${{ runner.temp }}/ai-chip-intelligence-triage.md
            ${{ runner.temp }}/ai-chip-intelligence-review-state.json
            ${{ runner.temp }}/ai-chip-intelligence-review-aging.md
            ${{ runner.temp }}/ai-chip-intelligence-health.json
            ${{ runner.temp }}/ai-chip-intelligence-health.md
            ${{ runner.temp }}/ai-chip-intelligence-operations.json
          if-no-files-found: ignore
          retention-days: 30
