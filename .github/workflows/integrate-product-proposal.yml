name: Integrate reviewed new product proposal

on:
  workflow_dispatch:
    inputs:
      proposal_path:
        description: Committed proposal under reviews/product-proposals/
        required: true
        type: string
      approval_path:
        description: Committed Approval Manifest under reviews/approvals/
        required: true
        type: string
      claim_report_path:
        description: Original Claim report under reviews/claims/
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: product-integration-proposal
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed review input paths
        env:
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          CLAIM_PATH: ${{ inputs.claim_report_path }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          checks = (
              ("PROPOSAL_PATH", "reviews/product-proposals/"),
              ("APPROVAL_PATH", "reviews/approvals/"),
              ("CLAIM_PATH", "reviews/claims/"),
          )
          for name, prefix in checks:
              value = os.environ[name]
              path = Path(value)
              cursor = Path.cwd()
              has_symlink = False
              for part in path.parts:
                  cursor = cursor / part
                  has_symlink = has_symlink or cursor.is_symlink()
              if (not value.startswith(prefix) or not value.endswith(".json") or
                      path.is_absolute() or ".." in path.parts or has_symlink or
                      not path.is_file() or not path.resolve().is_relative_to(Path.cwd().resolve())):
                  raise SystemExit("Invalid committed product-review input path: " + name)
              subprocess.run(["git", "ls-files", "--error-unmatch", "--", value],
                             check=True, stdout=subprocess.DEVNULL)
          print("PASS: all three review inputs are committed under designated paths")
          PY
      - name: Rebuild and verify the product proposal against current master
        id: proposal
        env:
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          CLAIM_PATH: ${{ inputs.claim_report_path }}
        run: |
          python3 scripts/build_product_creation_proposal.py verify \
            --company-profiles data/company-profiles.json \
            --proposal "$PROPOSAL_PATH" \
            --claim-report "$CLAIM_PATH" \
            --approval "$APPROVAL_PATH" \
            --database-output "$RUNNER_TEMP/company-profiles-proposed.json" \
            --patch-output "$RUNNER_TEMP/product-integration-patch.json" \
            --audit-output "$RUNNER_TEMP/product-integration-audit.json" \
            --diff-output "$RUNNER_TEMP/product-integration.diff"
          python3 - <<'PY'
          import json, os
          p = json.load(open(os.environ["PROPOSAL_PATH"], encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("proposal_id=" + p["proposal_id"] + "\n")
              out.write("company_id=" + p["target"]["company_id"] + "\n")
              out.write("product_id=" + p["target"]["product_id"] + "\n")
          PY
      - name: Apply proposal to temporary checkout and run full validator
        run: |
          cp "$RUNNER_TEMP/company-profiles-proposed.json" data/company-profiles.json
          python3 scripts/validate_company_profiles.py
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if paths != {"data/company-profiles.json"}:
              raise SystemExit("Unexpected modified paths: " + repr(paths))
          print("PASS: only data/company-profiles.json is modified")
          PY
      - name: Upload proposal audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-integration-${{ steps.proposal.outputs.proposal_id }}
          path: |
            ${{ runner.temp }}/product-integration-patch.json
            ${{ runner.temp }}/product-integration-audit.json
            ${{ runner.temp }}/product-integration.diff
          retention-days: 30
      - name: Create human-review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/company-profiles.json
          branch: automation/product-integration-${{ steps.proposal.outputs.proposal_id }}
          delete-branch: true
          commit-message: "Add reviewed product ${{ steps.proposal.outputs.product_id }}"
          title: "Add reviewed product to company profile registry"
          body: |
            This PR was generated from a committed, human-reviewed product-creation proposal.

            Proposal: ${{ inputs.proposal_path }}
            Approval Manifest: ${{ inputs.approval_path }}
            Original Claim report: ${{ inputs.claim_report_path }}
            Proposal ID: ${{ steps.proposal.outputs.proposal_id }}
            Company: ${{ steps.proposal.outputs.company_id }}
            Product: ${{ steps.proposal.outputs.product_id }}

            The workflow independently rebuilt the exact three-record append against
            current master, checked the package/base hashes and the separate source
            Claim and Approval Manifest, and ran the complete company-profile validator.

            The initial Claim is deliberately limited to product identity and remains
            vendor_reported. This does not verify source truth or imply measured
            performance. Inspect original sources, approval, diff and CI before merging.
