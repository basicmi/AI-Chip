name: Validate and build AI Chip site

on:
  pull_request:
    paths:
      - "**.md"
      - "_config.yml"
      - "_layouts/**"
      - "assets/**"
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "Gemfile"
      - ".github/workflows/**"
  push:
    branches: [master]
    paths:
      - "**.md"
      - "_config.yml"
      - "_layouts/**"
      - "assets/**"
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "Gemfile"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate compatibility and workload databases
        run: |
          python3 scripts/validate_compatibility.py
          python3 scripts/validate_workloads.py
          python3 scripts/validate_benchmarks.py
          python3 scripts/validate_company_profiles.py
          python3 scripts/validate_model_support.py
          python3 scripts/validate_model_catalog.py
          python3 scripts/validate_intelligence_sources.py
          python3 scripts/validate_intelligence_review_ledger.py --ledger data/intelligence-review-decisions.json
          python3 -m unittest discover -s tests -p "test_intelligence_review_ledger.py"
          python3 -m unittest discover -s tests -p "test_intelligence_discovery.py"
          python3 -m unittest discover -s tests -p "test_intelligence_feeds.py"
          python3 -m unittest discover -s tests -p "test_intelligence_claims.py"
          python3 -m unittest discover -s tests -p "test_intelligence_quality.py"
          python3 -m unittest discover -s tests -p "test_intelligence_retrieval.py"
          python3 -m unittest discover -s tests -p "test_intelligence_retrieval_diagnosis.py"
          python3 -m unittest discover -s tests -p "test_intelligence_retrieval_experiment.py"
          python3 -m unittest discover -s tests -p "test_intelligence_retrieval_review.py"
          python3 scripts/evaluate_intelligence_quality.py --golden data/intelligence-quality-golden.json
          python3 -m unittest discover -s tests -p "test_intelligence_evidence_graph.py"
          python3 -m unittest discover -s tests -p "test_intelligence_source_lineage.py"
          python3 -m unittest discover -s tests -p "test_intelligence_evidence_quality.py"
          python3 -m unittest discover -s tests -p "test_intelligence_evidence_dashboard.py"
          python3 -m unittest discover -s tests -p "test_intelligence_conversion_funnel.py"
          python3 -m unittest discover -s tests -p "test_intelligence_decision_analytics.py"
          python3 -m unittest discover -s tests -p "test_intelligence_triage.py"
          python3 -m unittest discover -s tests -p "test_intelligence_review_state.py"
          python3 -m unittest discover -s tests -p "test_intelligence_backlog_hydration.py"
          python3 -m unittest discover -s tests -p "test_intelligence_claim_review_batch.py"
          python3 -m unittest discover -s tests -p "test_intelligence_semantic_support.py"
          python3 -m unittest discover -s tests -p "test_intelligence_reliability.py"
          python3 -m unittest discover -s tests -p "test_intelligence_source_recovery.py"
          python3 -m unittest discover -s tests -p "test_intelligence_source_coverage.py"
          python3 -m unittest discover -s tests -p "test_intelligence_pagination.py"
          python3 -m unittest discover -s tests -p "test_intelligence_arxiv_pagination.py"
          python3 -m unittest discover -s tests -p "test_intelligence_request_diagnostics.py"
          python3 -m unittest discover -s tests -p "test_intelligence_operational_snapshot.py"
          python3 -m unittest discover -s tests -p "test_evidence_update_proposal.py"
          python3 -m unittest discover -s tests -p "test_evidence_to_pr_rehearsal.py"
          python3 -m unittest discover -s tests -p "test_database_integration_proposal.py"
          python3 -m unittest discover -s tests -p "test_product_creation_proposal.py"
          python3 -m unittest discover -s tests -p "test_model_catalog.py"
          python3 -m unittest discover -s tests -p "test_model_catalog_discovery.py"
          python3 scripts/validate_benchmark_results.py
          python3 scripts/validate_hardware_counter_mappings.py
          python3 -m unittest discover -s tests -p "test_data_maintenance.py"
          python3 -m unittest discover -s tests -p "test_benchmark_results.py"
          python3 -m unittest discover -s tests -p "test_benchmark_result_proposal.py"
          python3 -m unittest discover -s tests -p "test_benchmark_comparability.py"
          python3 scripts/assess_benchmark_comparability.py --output "$RUNNER_TEMP/benchmark-comparability-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_concurrency.py"
          python3 scripts/analyze_inferencex_concurrency.py --output "$RUNNER_TEMP/inferencex-concurrency-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_sequence_length.py"
          python3 scripts/analyze_inferencex_sequence_length.py --output "$RUNNER_TEMP/inferencex-sequence-length-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_isl_osl_interaction.py"
          python3 scripts/analyze_inferencex_isl_osl_interaction.py --output "$RUNNER_TEMP/inferencex-isl-osl-interaction-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_gpu_scaling.py"
          python3 scripts/analyze_inferencex_gpu_scaling.py --output "$RUNNER_TEMP/inferencex-gpu-scaling-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_coverage.py"
          python3 scripts/analyze_inferencex_coverage.py --output "$RUNNER_TEMP/inferencex-coverage-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_prefill_decode_scaling.py"
          python3 scripts/analyze_inferencex_prefill_decode_scaling.py --output "$RUNNER_TEMP/inferencex-prefill-decode-scaling-report.json"
          python3 -m unittest discover -s tests -p "test_inferencex_parallelism.py"
          python3 scripts/analyze_inferencex_parallelism.py --output "$RUNNER_TEMP/inferencex-parallelism-report.json"
          python3 -m unittest discover -s tests -p "test_hardware_counter_mappings.py"
          python3 -m unittest discover -s tests -p "test_hardware_metric_derivation.py"
          python3 -m unittest discover -s tests -p "test_hardware_performance_diagnosis.py"
          python3 -m unittest discover -s tests -p "test_performance_experiment_plan.py"
          python3 -m unittest discover -s tests -p "test_performance_evidence_review.py"
          python3 -m unittest discover -s tests -p "test_performance_review_ledger.py"
          python3 -m unittest discover -s tests -p "test_performance_knowledge_extraction.py"
          python3 -m unittest discover -s tests -p "test_performance_knowledge_applicability.py"
          python3 -m unittest discover -s tests -p "test_performance_knowledge_retrieval.py"
          python3 -m unittest discover -s tests -p "test_performance_hypothesis_comparison.py"
          python3 -m unittest discover -s tests -p "test_gpu_execution_efficiency.py"
          python3 -m unittest discover -s tests -p "test_runtime_hardware_alignment.py"
          python3 -m unittest discover -s tests -p "test_runtime_phase_decomposition.py"
          python3 -m unittest discover -s tests -p "test_otel_trace_import.py"
          python3 -m unittest discover -s tests -p "test_live_otel_collector.py"
          python3 -m unittest discover -s tests -p "test_nsys_sqlite_import.py"
          python3 -m unittest discover -s tests -p "test_dcgm_telemetry_import.py"
          python3 -m unittest discover -s tests -p "test_capture_harness.py"
          python3 -m unittest discover -s tests -p "test_gpu_identity_reconciliation.py"
          python3 -m unittest discover -s tests -p "test_cross_layer_performance_correlation.py"
      - name: Upload benchmark comparability assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparability-assessment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/benchmark-comparability-report.json
            ${{ runner.temp }}/inferencex-concurrency-report.json
            ${{ runner.temp }}/inferencex-sequence-length-report.json
            ${{ runner.temp }}/inferencex-isl-osl-interaction-report.json
            ${{ runner.temp }}/inferencex-gpu-scaling-report.json
            ${{ runner.temp }}/inferencex-coverage-report.json
            ${{ runner.temp }}/inferencex-prefill-decode-scaling-report.json
            ${{ runner.temp }}/inferencex-parallelism-report.json
          if-no-files-found: ignore
          retention-days: 14

  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GitHub Pages dependencies
        run: bundle install
      - name: Prepare compressed benchmark registry
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          source = Path("data/benchmark-results.json")
          target = Path("data/benchmark-results.json.gz")
          with source.open("rb") as input_file, target.open("wb") as output_file:
              with gzip.GzipFile(fileobj=output_file, mode="wb", compresslevel=9, mtime=0) as compressed:
                  compressed.write(input_file.read())
          print(f"Prepared {target}: {target.stat().st_size:,} bytes")
          PY
      - name: Build GitHub Pages site
        run: bundle exec jekyll build
      - name: Verify static assets in generated site
        run: |
          test -s _site/assets/js/benchmark-explorer.js
          test -s _site/assets/js/benchmark-results.js
          test -s _site/results/index.html
          test -s _site/concurrency/index.html
          test -s _site/coverage/index.html
          test -s _site/performance/index.html
          test -s _site/cross-benchmark/index.html
          test -s _site/diagnosis/index.html
          test -s _site/performance-evidence/index.html
          test -s _site/assets/js/performance-evidence-workbench.js
          test -s _site/assets/css/performance-evidence-workbench.css
          test -s _site/assets/js/performance-diagnosis.js
          test -s _site/assets/css/performance-diagnosis.css
          test -s docs/hardware-performance-diagnosis.md
          test -s _site/assets/js/cross-benchmark.js
          test -s _site/assets/css/cross-benchmark.css
          test -s docs/cross-benchmark-evidence.md
          test -s _site/recipe-review/index.html
          test -s _site/assets/js/recipe-review.js
          test -s _site/assets/css/recipe-review.css
          test -s _site/assets/js/performance-workspace.js
          test -s _site/assets/css/performance-workspace.css
          test -s _site/assets/js/inferencex-coverage.js
          test -s _site/assets/css/inferencex-coverage.css
          test -s _site/assets/js/concurrency-explorer.js
          test -s _site/data/benchmark-results.json
          test -s _site/data/benchmark-results.json.gz
          test -s _site/assets/js/directory-explorer.js
          test -s _site/assets/js/product-explorer.js
          test -s _site/assets/js/model-support-explorer.js
          test -s _site/model-support/index.html
          test -s _site/data/model-support.json
          test -s _site/schemas/model-support.schema.json
          test -s _site/data/hardware-counter-mappings.json
          test -s _site/schemas/hardware-counter-mappings.schema.json
          test -s _site/products/index.html
          test -s _site/data/company-profiles.json
          test -s _site/resource/AI_Chip_Landscape_v0p9p1.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "resource/AI_Chip_Landscape_v0p9p1.svg"
          root = ET.parse(path).getroot()
          assert root.tag.endswith("svg"), "Landscape asset is not an SVG document"
          assert root.attrib.get("viewBox") == "0 0 2000 1260", "Unexpected landscape canvas"
          images = root.findall("{http://www.w3.org/2000/svg}image")
          assert len(images) == 48, f"Expected 48 embedded company logos, found {len(images)}"
          assert all(image.attrib.get('{http://www.w3.org/1999/xlink}href', '').startswith('data:image/') for image in images), 'All company logos must be embedded data URIs'
          print(f"PASS: landscape SVG parsed; {len(images)} embedded company logos.")
          PY
          echo "Benchmark explorer and landscape assets found in generated site."
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve generated site
        run: |
          python3 tests/serve_site.py > /tmp/ai-chip-site.log 2>&1 &
          echo $! > /tmp/ai-chip-site.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/AI-Chip/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-chip-site.log
          exit 1
      - name: Browser smoke tests
        run: node tests/site-smoke.cjs
