name: Propose reviewed company evidence PR

on:
  workflow_dispatch:
    inputs:
      approval_path:
        description: Committed reviewed approval manifest under reviews/approvals/
        required: true
        type: string
      claim_report_path:
        description: Committed extracted claim report under reviews/claims/
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reviewed-evidence-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check committed input paths
        env:
          APPROVAL_PATH: ${{ inputs.approval_path }}
          CLAIM_PATH: ${{ inputs.claim_report_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name, prefix in (("APPROVAL_PATH", "reviews/approvals/"), ("CLAIM_PATH", "reviews/claims/")):
              value = os.environ[name]
              p = Path(value)
              if (not value.startswith(prefix) or not value.endswith(".json") or
                      p.is_absolute() or ".." in p.parts or p.is_symlink() or not p.is_file() or
                      not p.resolve().is_relative_to(Path.cwd().resolve())):
                  raise SystemExit("Invalid committed review path: " + name)
          print("PASS: reviewed manifest paths are confined to the checkout")
          PY
      - name: Generate evidence-only change
        env:
          APPROVAL_PATH: ${{ inputs.approval_path }}
          CLAIM_PATH: ${{ inputs.claim_report_path }}
        run: |
          python3 scripts/propose_evidence_update.py \
            --company-profiles data/company-profiles.json \
            --claim-report "$CLAIM_PATH" \
            --approval "$APPROVAL_PATH" \
            --output "$RUNNER_TEMP/company-profiles-proposal.json" \
            --audit-output "$RUNNER_TEMP/evidence-approval-audit.json" \
            --diff-output "$RUNNER_TEMP/evidence-update.diff"
          cp "$RUNNER_TEMP/company-profiles-proposal.json" data/company-profiles.json
      - name: Validate generated company profile data and bounded changed paths
        run: |
          python3 scripts/validate_company_profiles.py
          python3 - <<'PY'
          import subprocess
          allowed = {"data/company-profiles.json"}
          paths = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if paths != allowed:
              raise SystemExit("Unexpected modified paths: " + repr(paths))
          print("PASS: only the company profile database changed")
          PY
      - name: Attach audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-evidence-proposal
          path: |
            ${{ runner.temp }}/evidence-approval-audit.json
            ${{ runner.temp }}/evidence-update.diff
          retention-days: 30
      - name: Create review-only pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/company-profiles.json
          branch: automation/reviewed-evidence-attachment
          delete-branch: true
          commit-message: "Attach human-reviewed evidence to existing company claim"
          title: "Review approved evidence attachment to company profile"
          body: |
            This PR is generated by a manual workflow_dispatch from a committed reviewer approval.
            It attaches one reviewed source to one existing claim without changing any claim
            value, unit, scope, status, product identity or model support.

            The workflow validated the company-profile registry; inspect the linked
            approval manifest, original source and SHA256 target claim guard before merge.
            The extracted source remains an unverified candidate.
