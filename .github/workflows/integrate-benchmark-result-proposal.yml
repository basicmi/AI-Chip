name: Integrate reviewed benchmark result proposal

on:
  workflow_dispatch:
    inputs:
      proposal_path:
        description: Committed proposal JSON under reviews/benchmark-proposals/
        required: true
        type: string
      approval_path:
        description: Separate committed Approval Manifest JSON under reviews/approvals/
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark-result-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed review input paths
        env:
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          checks = (
              ("PROPOSAL_PATH", "reviews/benchmark-proposals/"),
              ("APPROVAL_PATH", "reviews/approvals/"),
          )
          for name, prefix in checks:
              value = os.environ[name]
              path = Path(value)
              cursor = Path.cwd()
              has_symlink = False
              for part in path.parts:
                  cursor = cursor / part
                  has_symlink = has_symlink or cursor.is_symlink()
              if (not value.startswith(prefix) or not value.endswith(".json") or
                      path.is_absolute() or ".." in path.parts or has_symlink or
                      not path.is_file() or
                      not path.resolve().is_relative_to(Path.cwd().resolve())):
                  raise SystemExit("Invalid committed benchmark-review input path: " + name)
              subprocess.run(
                  ["git", "ls-files", "--error-unmatch", "--", value],
                  check=True, stdout=subprocess.DEVNULL
              )
          print("PASS: proposal and separate Approval Manifest are tracked under designated paths")
          PY

      - name: Rebuild and verify proposal against current master registry
        id: proposal
        env:
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
        run: |
          python3 scripts/build_benchmark_result_proposal.py verify \
            --benchmark-results data/benchmark-results.json \
            --proposal "$PROPOSAL_PATH" \
            --approval "$APPROVAL_PATH" \
            --database-output "$RUNNER_TEMP/benchmark-results-proposed.json" \
            --patch-output "$RUNNER_TEMP/benchmark-integration-patch.json" \
            --audit-output "$RUNNER_TEMP/benchmark-integration-audit.json" \
            --diff-output "$RUNNER_TEMP/benchmark-integration.diff"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          proposal = json.loads(Path(os.environ["PROPOSAL_PATH"]).read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("proposal_id=" + proposal["proposal_id"] + "\n")
              output.write("record_id=" + proposal["target"]["record_id"] + "\n")
              output.write("source_id=" + proposal["target"]["source_id"] + "\n")
          PY

      - name: Apply verified proposal in the temporary checkout and run full validation
        run: |
          cp "$RUNNER_TEMP/benchmark-results-proposed.json" data/benchmark-results.json
          python3 scripts/validate_benchmark_results.py
          python3 -m unittest discover -s tests -p "test_benchmark_result_proposal.py"
          python3 - <<'PY'
          import subprocess

          paths = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          expected = {"data/benchmark-results.json"}
          if paths != expected:
              raise SystemExit("Unexpected modified paths: " + repr(paths))
          print("PASS: only data/benchmark-results.json is modified")
          PY

      - name: Upload proposal audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result-integration-${{ steps.proposal.outputs.proposal_id }}
          path: |
            ${{ runner.temp }}/benchmark-integration-patch.json
            ${{ runner.temp }}/benchmark-integration-audit.json
            ${{ runner.temp }}/benchmark-integration.diff
          retention-days: 30

      - name: Create human-review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/benchmark-results.json
          branch: automation/benchmark-result-integration-${{ steps.proposal.outputs.proposal_id }}
          delete-branch: true
          commit-message: "Add reviewed benchmark result ${{ steps.proposal.outputs.record_id }}"
          title: "Add reviewed benchmark result to registry"
          body: |
            This PR was generated from a committed, human-reviewed benchmark result proposal.

            Proposal: ${{ inputs.proposal_path }}
            Approval Manifest: ${{ inputs.approval_path }}
            Proposal ID: ${{ steps.proposal.outputs.proposal_id }}
            Registered source: ${{ steps.proposal.outputs.source_id }}
            Result record: ${{ steps.proposal.outputs.record_id }}

            The workflow independently rebuilt the proposal against the current master
            benchmark registry, checked the separate Approval Manifest and exact base
            SHA256, verified the registered source identity and the exact five-operation
            append/reconciliation, and ran the complete benchmark registry validator and
            proposal unit tests.

            The only proposed data change is data/benchmark-results.json. The workflow
            does not verify source truth, promote evidence class, infer missing values,
            or automatically merge. Inspect the original source, Approval Manifest,
            audit artifacts, diff and CI results before merging.
